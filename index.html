<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>وقتي</title>
<meta name="description" content="تنظيم اليوم على مواقيت الصلاة: مهام، كانبان، مؤقت لكل مهمة، وبومودورو">
<meta name="theme-color" content="#0F6F63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* التخطيط: شريط تنقل جانبي (سفلي على الجوال) + شريط صلاة ثابت أعلى المحتوى.
   اليوم كله مقسوم إلى ست فترات بين الأذانات، وكل لون يخص فترة. */
:root{
  --bg:#EBEFEC; --surface:#F7F9F8; --surface2:#DFE6E2; --ink:#10302B; --muted:#587069; --line:#C7D3CE;
  --accent:#0E6B5E; --on-accent:#F4FBF9; --gold:#8F5A0C; --gold-bg:#F4E6C8;
  --good:#23764A; --warn:#8F5A0C; --bad:#B0382E;
  --p-fajr:#5560B0; --p-duha:#C9921B; --p-dhuhr:#2E8C86; --p-asr:#7C9F34; --p-maghrib:#CF623A; --p-isha:#3C4180;
  --c1:#3F6FB5; --c2:#8A5CB8; --c3:#2E8C86; --c4:#C9743A; --c5:#4C9A52; --c6:#7A8A86;
  --font-display:'Reem Kufi','Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1413; --surface:#122220; --surface2:#1A2E2B; --ink:#E4EFEC; --muted:#8FA8A2; --line:#25403B;
    --accent:#4FC7B2; --on-accent:#06201C; --gold:#E4B04A; --gold-bg:#3A2D12;
    --good:#5FCB8A; --warn:#E4B04A; --bad:#FF8E7E;
    --p-fajr:#8C96E0; --p-duha:#E6B84A; --p-dhuhr:#55C2B8; --p-asr:#A5CC62; --p-maghrib:#F08A60; --p-isha:#7F86D8;
    --c1:#7BA3E6; --c2:#B994E6; --c3:#55C2B8; --c4:#F0A06A; --c5:#82CC88; --c6:#9AAAA6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1413; --surface:#122220; --surface2:#1A2E2B; --ink:#E4EFEC; --muted:#8FA8A2; --line:#25403B;
  --accent:#4FC7B2; --on-accent:#06201C; --gold:#E4B04A; --gold-bg:#3A2D12;
  --good:#5FCB8A; --warn:#E4B04A; --bad:#FF8E7E;
  --p-fajr:#8C96E0; --p-duha:#E6B84A; --p-dhuhr:#55C2B8; --p-asr:#A5CC62; --p-maghrib:#F08A60; --p-isha:#7F86D8;
  --c1:#7BA3E6; --c2:#B994E6; --c3:#55C2B8; --c4:#F0A06A; --c5:#82CC88; --c6:#9AAAA6;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{flex:none}

.app{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:18px 8px;background:var(--surface);border-inline-end:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;text-align:center;padding:4px 0 14px;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;flex:none;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:12px}
.nav button.on{background:var(--surface2);color:var(--ink)}
.nav button:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,.tick:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.main{min-width:0;padding:0 clamp(16px,3vw,32px) 48px}
.top{position:sticky;top:0;z-index:15;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.np{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.np-l{font-size:12px;color:var(--muted)}
.np-n{font-family:var(--font-display);font-size:20px;font-weight:600}
.np-t{color:var(--muted)}
.np-cd{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--gold)}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;max-width:100%}
.chipbtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.rec{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
button.chipbtn-s{border:0;cursor:pointer;font:inherit;color:var(--muted)}
.warn-t{color:var(--bad)}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.pagehead h2{font-size:26px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:10px;background:var(--gold-bg);color:var(--gold);margin-bottom:14px;font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.iconbtn.sm{width:28px;height:28px}

.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.col-side{display:grid;gap:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.3;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.pstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:18px}
.pcell{display:grid;gap:0;text-align:center;padding:8px 4px;border-radius:8px;background:var(--surface2)}
.pcell small{color:var(--muted);font-size:12px}
.pcell b{font-weight:500;font-size:14px}
.pcell.next{background:var(--gold-bg);color:var(--gold)}
.pcell.next small{color:inherit}
.tlwrap{position:relative;padding:7px 0;margin-bottom:18px}
.tl{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.tl i{display:block;background:var(--c);opacity:.9;border-inline-end:2px solid var(--bg)}
.tl-now{position:absolute;top:0;bottom:0;width:4px;margin-inline-start:-2px;border-radius:2px;background:var(--gold)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h3{font-size:18px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{display:grid;gap:8px;align-content:start;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.pcard.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pcard.past{opacity:.72}
.pc-h{display:flex;align-items:center;gap:8px}
.pc-h h4{font-size:16px;flex:1;min-width:0}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.pc-r{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--pc);border-radius:3px}
.meter.over i{background:var(--bad)}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.pmeta .over{color:var(--bad);font-weight:600}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pt{display:flex;align-items:center;gap:8px;padding:4px 0;min-width:0}
.pt.run .pt-title{color:var(--accent);font-weight:600}
.pt-title{flex:1;min-width:0;text-align:start;border:0;background:transparent;padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{width:24px;height:24px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--muted);border-radius:7px;background:transparent;color:transparent;padding:0}
.tick:hover{color:var(--accent);border-color:var(--accent)}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.link{border:0;background:transparent;color:var(--accent);padding:2px 0;text-align:start;font-size:13px}
.checks{display:grid;gap:6px}
.crow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .nm{flex:1}
.crow.passed .nm{font-weight:600}
.crow .num{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.bar{fill:var(--accent);opacity:.4}
.bar.today{opacity:1}
.axis{stroke:var(--line);stroke-width:1}
.lbl{fill:var(--muted);font:11px var(--font-body)}
.val{fill:var(--ink);font:600 11px var(--font-body)}

.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.quick input{flex:1;min-width:200px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:70px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters .fchips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
.fc{padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.fc.on{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.later-bar{margin-bottom:12px}
.later-bar .fc{display:inline-flex;align-items:center;gap:6px}
.filters select,.filters input{width:auto;min-width:150px;flex:1 1 150px;max-width:260px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface2);border-radius:12px;padding:10px;display:grid;gap:10px;align-content:start;min-height:140px}
.col.over{outline:2px dashed var(--accent)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.col-h h3{font-size:16px}
.col-h .cnt{font-size:12px;color:var(--muted);margin-inline-start:6px}
.card{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:grab;min-width:0}
.card.running{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 28%,transparent)}
.card.drag{opacity:.45}
.card.done .c-title{text-decoration:line-through;color:var(--muted)}
.c-top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.cdot{width:9px;height:9px;border-radius:50%;background:var(--cat)}
.prio{margin-inline-start:auto;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface2)}
.prio-urgent{background:var(--bad);color:var(--surface)}
.prio-high{background:var(--gold-bg);color:var(--gold)}
.c-title{font-family:var(--font-body);font-weight:600;font-size:15px;margin:0;overflow-wrap:anywhere}
.c-notes{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:12px}
.chip.late{background:var(--bad);color:var(--surface)}
.chip .pdot{width:8px;height:8px}
.c-prog{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.c-act{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.c-act .grow{flex:1}
.c-time{font-size:13px;color:var(--muted)}
.card.running .c-time{color:var(--accent);font-weight:600}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px}
.arch{margin-top:18px;scroll-margin-top:90px}
.arch .sub-h:first-of-type{margin-top:0}

.pomo{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
.pomo-main{display:grid;gap:18px;justify-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:10px;background:var(--surface2);justify-content:center}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;color:var(--muted);font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink)}
.ring{position:relative;width:min(280px,100%);aspect-ratio:1}
.ringsvg{width:100%;height:100%;display:block}
.rb{fill:none;stroke:var(--surface2);stroke-width:10}
.rf{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round}
.rf.rest{stroke:var(--p-dhuhr)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.ring-t{font-family:var(--font-display);font-size:clamp(40px,12vw,56px);font-weight:600;line-height:1.1}
.ctrls{display:flex;gap:10px;align-items:center}
.bigplay{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center}
.bigplay:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent)}
.dots i.f{background:var(--accent)}
.field{display:grid;gap:4px;width:100%}
.field label{font-size:13px;color:var(--muted)}
.hint{display:grid;gap:10px;padding:14px;border-radius:10px;background:var(--gold-bg);color:var(--gold)}
.hint.calm{background:var(--surface2);color:var(--ink)}

.sgroup{display:grid;gap:0;margin-bottom:18px}
.sgroup h3{font-size:18px;margin-bottom:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow small{display:block;color:var(--muted);font-size:12px}
.srow .ctl{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.offs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.offs label{display:grid;gap:3px;font-size:13px;color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(580px,94vw);max-height:92dvh}
dialog::backdrop{background:rgba(5,15,14,.55)}
.dlg{display:grid;gap:14px;padding:20px;max-height:92dvh;overflow:auto}
.dlg h3{font-size:20px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.subrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.subrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.dact{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.dact .r{display:flex;gap:8px}

.rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
.ringcard{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.mring{position:relative;width:76px;height:76px;flex:none}
.mring svg{width:100%;height:100%;display:block}
.mring .mb{fill:none;stroke:var(--surface2);stroke-width:8}
.mring .mf{fill:none;stroke:var(--rc);stroke-width:8;stroke-linecap:round}
.mring b{position:absolute;inset:0;display:grid;place-content:center;font-family:var(--font-display);font-size:18px;font-weight:600}
.ringcard h4{font-size:15px;margin-bottom:2px}
.ringcard p{font-size:13px;color:var(--muted)}
.mustbox{margin-bottom:18px}
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.proj{display:grid;gap:10px;align-content:start;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.proj h3{font-size:18px;display:flex;align-items:center;gap:8px}
.proj .big{font-family:var(--font-display);font-size:24px;font-weight:600}
.proj details summary{cursor:pointer;color:var(--accent);font-size:13px}
.ptasks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:14px}
.ptasks li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--line)}
.rep-controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.rt{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.rt th,table.rt td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line)}
table.rt th{font-weight:500;color:var(--muted);font-size:12px;background:var(--surface2);white-space:nowrap}
table.rt tr:last-child td{border-bottom:0}
table.rt td.n{white-space:nowrap}
.gaps{display:grid;gap:10px}
.gap{display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gap b{font-weight:600}
.gap.bad b{color:var(--bad)}
.gap.warn b{color:var(--warn)}
.gap .gl{display:flex;flex-wrap:wrap;gap:6px}
.toasts{position:fixed;inset-inline:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:60;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:min(92vw,460px);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sub-h{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted);margin:14px 0 6px}

/* العادات */
.hlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.habit{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.habit-h{display:flex;align-items:center;gap:10px}
.habit-h h4{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.hdots{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px}
.hdots button{aspect-ratio:1;min-width:0;padding:0;border:0;border-radius:3px;background:var(--surface2)}
.hdots button.f{background:var(--accent)}
.hdots button.t{box-shadow:inset 0 0 0 2px var(--gold)}
.hdots button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

const fmtMin=min=>{min=Math.round(min);if(min<60)return min+' د';const h=Math.floor(min/60),m=min%60;return m?h+' س '+m+' د':h+' س';};

/* ========= مواقيت الصلاة من الإنترنت (Aladhan) ========= */
function hm(str){const m=/(\d{1,2}):(\d{2})/.exec(str||'');return m?pad(+m[1])+':'+m[2]:null;}
async function fetchMonth(y,m){
  const s=S.settings, useG=s.useGps&&s.lat!=null;
  const loc=useG?'g'+Number(s.lat).toFixed(3)+','+Number(s.lng).toFixed(3):'c'+s.city+'|'+s.country;
  const key=y+'-'+m+'|'+loc+'|'+s.method+'|'+s.school;
  if(!S.cache[key]){
    const q='method='+s.method+'&school='+s.school;
    const url=useG
      ?'https://api.aladhan.com/v1/calendar/'+y+'/'+m+'?latitude='+s.lat+'&longitude='+s.lng+'&'+q
      :'https://api.aladhan.com/v1/calendarByCity/'+y+'/'+m+'?city='+encodeURIComponent(s.city)+'&country='+encodeURIComponent(s.country)+'&'+q;
    const r=await fetch(url);
    if(!r.ok) throw new Error('http '+r.status);
    const j=await r.json();
    if(j.code!==200||!Array.isArray(j.data)) throw new Error('bad data');
    const out={};
    for(const it of j.data){
      const t={}; const T=it.timings||{};
      t.fajr=hm(T.Fajr);t.sunrise=hm(T.Sunrise);t.dhuhr=hm(T.Dhuhr);t.asr=hm(T.Asr);t.maghrib=hm(T.Maghrib);t.isha=hm(T.Isha);
      out[+it.date.gregorian.day]=t;
    }
    S.cache[key]=out;
    const ks=Object.keys(S.cache); while(ks.length>8){delete S.cache[ks.shift()];}
    save(); return out;
  }
  return S.cache[key];
}
async function ensureTimes(){
  TS.loading=true; TS.err=null;
  const today=startOfDay(new Date());
  const months=new Set([-1,0,1].map(o=>{const d=addDays(today,o);return d.getFullYear()+'-'+(d.getMonth()+1);}));
  for(const ym of months){
    const [y,m]=ym.split('-').map(Number);
    try{
      const data=await fetchMonth(y,m);
      for(const day of Object.keys(data)) DAYS[y+'-'+pad(m)+'-'+pad(day)]=data[day];
    }catch(e){TS.err=e;}
  }
  TS.loading=false;
}
function timesOn(d){
  const raw=DAYS[dkey(d)]; if(!raw) return null;
  const o=S.settings.offsets, r={};
  for(const k of PR){
    if(!raw[k]) return null;
    const [h,m]=raw[k].split(':').map(Number);
    r[k]=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m+(o[k]||0),0,0);
  }
  return r;
}
function prayerInstants(){
  const t0=startOfDay(new Date()), out=[];
  for(const off of [-1,0,1]){
    const d=addDays(t0,off), t=timesOn(d); if(!t) continue;
    for(const k of PR5) out.push({k,t:t[k],name:(k==='dhuhr'&&d.getDay()===5)?'الجمعة':PRN[k]});
  }
  return out.sort((a,b)=>a.t-b.t);
}
const nextPrayer=now=>prayerInstants().find(p=>p.t>now)||null;
function periodsOn(d){
  const t=timesOn(d); if(!t) return null;
  return PERIODS.map(p=>({k:p.k,from:p.from,
    name:(p.k==='dhuhr'&&d.getDay()===5)?'بعد الجمعة':p.name,
    start:t[p.from],
    end:p.to==='midnight'?startOfDay(addDays(d,1)):t[p.to]}));
}
function currentPeriod(now){
  const d=startOfDay(now), ps=periodsOn(d); if(!ps) return null;
  const p=ps.find(x=>now>=x.start&&now<x.end);
  return p?Object.assign({date:d},p):null;
}
function availMin(p){
  const reserve=p.from==='sunrise'?0:S.settings.prayerMin;

}

/* ========= المهام ========= */
const taskById=id=>S.tasks.find(t=>t.id===id);
const todayKey=()=>dkey(new Date());
const isToday=t=>!t.daily&&(t.status==='todo'||t.status==='doing')&&!!t.period&&(!t.due||t.due<=todayKey());
/* مهمة «قيد الانتظار» موعدها بعد اليوم: تُخفى من اللوحة حتى يحلّ يومها (زر «المجدولة» يُظهرها). «جاري» تبقى ظاهرة لأنها بدأت فعلًا */
const isLater=t=>t.status==='todo'&&!!t.due&&t.due>todayKey();
/* مهمة منتهية متكررة موعد نسختها التالية لم يحلّ بعد، فلم تُولَّد (يعرضها التقويم، ويسلّمها deleteTask لنسختها عند الحذف) */
const pendingRepeat=t=>t.status==='done'&&!!t.nextDue&&!t.nextId&&!t.daily&&!t.ex;
const laterToast=t=>{if(UI.view==='board'&&!UI.later&&isLater(t)) toast('المهمة مجدولة ليوم '+t.due+' وتظهر في اللوحة حين يحلّ يومها');};
function taskSpent(t){return (t.spent||0)+((S.timer&&S.timer.taskId===t.id)?(Date.now()-S.timer.startedAt)/1000:0);}
function plannedMin(k){return S.tasks.filter(t=>isToday(t)&&t.period===k).reduce((a,t)=>a+Math.max(0,(t.est||0)-taskSpent(t)/60),0);}
function newTask(p){
  const t=Object.assign({id:uid(),title:'',notes:'',cat:'personal',prio:'normal',period:'',due:'',est:0,repeat:'none',status:'todo',subs:[],spent:0,pomos:0,created:Date.now(),doneAt:null,ex:false,projectId:'',daily:false,tplId:'',must:false,missed:false,remind:''},p);
  S.tasks.push(t); return t;
}
/* المهمة المتكررة لا تولّد نسختها التالية عند الإنجاز، بل تحفظ موعدها فقط (nextDue، وهو دائمًا بعد اليوم)،
   وتولّدها ensureRepeats مرة واحدة (nextId) حين يحلّ ذلك اليوم حتى لا تظهر في اللوحة قبل أوانها.
   إرجاع المهمة عن «منتهي» يلغي الموعد، ويحذف النسخة إن وُلدت ولم تُمس منذ توليدها (nextH بصمتها وقت التوليد) */
function spawnRepeat(t){
  if(!t.repeat||t.repeat==='none'||t.nextId||t.nextDue) return;
  const step=t.repeat==='daily'?1:7, today=startOfDay(new Date());
  let nxt=addDays(t.due?parseKey(t.due):today,step);
  while(nxt<=today) nxt=addDays(nxt,step);
  t.nextDue=dkey(nxt);
}
function unspawnRepeat(t){
  if(!t.nextId){t.nextDue='';return;}
  const c=taskById(t.nextId);
  if(c&&hsh(c)!==t.nextH) return;
  if(c){releaseTask(c.id);S.tasks=S.tasks.filter(x=>x!==c);}
  t.nextId=''; t.nextH=''; t.nextDue='';
}
/* معرّف النسخة ثابت (جذر السلسلة~الموعد) فلا تتكرر إن ولّدها جهازان، وتُعلَّم بـ _a كالمهام اليومية فيغلبها أي تعديل حقيقي */
function spawnCopy(t,ids){
  const rid=t.rid||t.id, iid=rid+'~'+t.nextDue;
  if(ids.has(iid)) t.nextH='';
  else{
    const c=Object.assign({},t,{id:iid,rid:rid,status:'todo',spent:0,pomos:0,doneAt:null,ex:false,created:Date.now(),due:t.nextDue,nextId:'',nextH:'',nextDue:'',_u:0,subs:(t.subs||[]).map(s=>({t:s.t,d:false}))});
    c._a=hsh(c); S.tasks.push(c); ids.add(iid); t.nextH=hsh(c);
  }
  t.nextId=iid;
}
function ensureRepeats(){
  const tk=todayKey(), ids=new Set(S.tasks.map(t=>t.id)); let ch=false;
  for(const t of S.tasks.slice()){
    if(!pendingRepeat(t)||t.nextDue>tk) continue;
    spawnCopy(t,ids); ch=true;
  }
  return ch;
}
function setStatus(id,st){
  const t=taskById(id); if(!t||t.status===st) return;
  if(st==='done'){
    if(S.timer&&S.timer.taskId===id){ if(S.timer.by==='pomo') pomoPause(); else stopTimer(); }
    t.status='done'; t.doneAt=Date.now(); spawnRepeat(t);
    toast('أحسنت، أُنجزت: '+t.title+(t.nextDue&&!t.nextId?' · تتكرر يوم '+t.nextDue:''));
  }else{ if(t.status==='done') unspawnRepeat(t); if(st==='backlog') releaseTask(id); t.status=st; t.doneAt=null; if(st==='todo') laterToast(t); }
  save(); render();
}
/* فك ارتباط المهمة بالمؤقتات قبل حذفها. إن كانت داخل جلسة بومودورو جارية تكمل الجلسة كتركيز عام حتى لا يضيع وقتها */
function releaseTask(id){
  if(S.timer&&S.timer.taskId===id){
    const byPomo=S.timer.by==='pomo'; stopTimer();
    if(byPomo&&S.pomo.running&&S.pomo.mode==='work') startTimer('','pomo');
  }
  if(S.pomo.taskId===id) S.pomo.taskId='';
}
function deleteTask(id){
  releaseTask(id);
  const t=taskById(id);
  if(t&&pendingRepeat(t)) spawnCopy(t,new Set(S.tasks.map(x=>x.id))); // حذف المنتهية لا يوقف التكرار: تُولَّد نسختها الآن (مخفية في «المجدولة» حتى يومها)
  S.tasks=S.tasks.filter(t=>t.id!==id); save(); render();
}
function seed(){

function moveOverdue(k){

const projById=id=>S.projects.find(p=>p.id===id);
const sessPid=s=>{const t=taskById(s.id);return t?(t.projectId||''):(s.pid||'');};
function projMinutes(pid,from,to){
  let m=0;
  for(const s of S.sessions){if(sessPid(s)!==pid)continue;if(from&&s.s<from)continue;if(to&&s.s>=to)continue;m+=(s.e-s.s)/60000;}
  if(S.timer){const t=taskById(S.timer.taskId);if(t&&t.projectId===pid&&(!from||S.timer.startedAt>=from))m+=(Date.now()-S.timer.startedAt)/60000;}
  return m;
}
/* تنشئ نسخة اليوم من كل مهمة يومية، وتسجّل «فائتة» لكل يوم مضى بلا إنجاز، بما فيها الأيام التي لم يُفتح فيها التطبيق
   (من أول يوم للمهمة، وبحد أقصى سنة). ما تغيّره هذه الدالة تلقائيًا يُعلَّم بـ _a حتى لا يغلب في المزامنة تعديلًا حقيقيًا من جهاز آخر.
   الأيام الماضية لا تُملأ قبل أول سحب من السحابة، لأن الجهاز الآخر قد يكون أنجزها أو أوقف المهمة.
   وتولّد أيضًا نسخ المهام المتكررة التي حلّ موعدها (ensureRepeats) */
function ensureDaily(){
  const tk=todayKey(), ids=new Set(S.tasks.map(t=>t.id)), first={}, back=CLOUD.ready; let ch=false;
  for(const t of S.tasks){
    if(t.must&&t.due&&t.due<tk&&t.status!=='done'&&t.status!=='missed'){t.status='missed';t.missed=true;t._u=(t._u||0)+1;t._a=hsh(t);ch=true;}
    if(t.tplId&&t.due&&(!first[t.tplId]||t.due<first[t.tplId])) first[t.tplId]=t.due;
  }
  const lim=dkey(addDays(startOfDay(new Date()),-366));
  for(const tpl of S.tasks.filter(t=>t.daily)){
    let k=back?(tpl.since&&(!first[tpl.id]||tpl.since<first[tpl.id])?tpl.since:(first[tpl.id]||tk)):tk;
    if(k<lim) k=lim;
    for(;k<=tk;k=dkey(addDays(parseKey(k),1))){
      const iid=tpl.id+'@'+k; if(ids.has(iid)) continue;
      const past=k<tk, x=Object.assign({},tpl,{id:iid,daily:false,tplId:tpl.id,must:true,due:k,status:past?'missed':'todo',spent:0,pomos:0,doneAt:null,repeat:'none',missed:past,created:Date.now(),ex:false,_u:0,subs:(tpl.subs||[]).map(s=>({t:s.t,d:false}))});
      delete x.since; delete x.nextId; delete x.nextH;
      x._a=hsh(x); S.tasks.push(x); ids.add(iid); ch=true;
    }
  }
  if(ensureRepeats()) ch=true;
  if(ch) save();
}
function mustStreak(){
  const by={};
  for(const t of S.tasks){if(t.must&&t.due)(by[t.due]=by[t.due]||[]).push(t);}
  const full=k=>!!by[k]&&by[k].every(t=>t.status==='done');
  let n=0,d=startOfDay(new Date());if(!full(dkey(d)))d=addDays(d,-1);
  for(let i=0;i<500&&full(dkey(d));i++){n++;d=addDays(d,-1);}
  return n;
}
function dayProgress(){
  const tk=todayKey();
  const must=S.tasks.filter(t=>t.must&&t.due===tk), md=must.filter(t=>t.status==='done').length;
  const doneO=S.tasks.filter(t=>!t.must&&!t.daily&&t.doneAt&&dkey(new Date(t.doneAt))===tk).length;
  const pendO=S.tasks.filter(t=>!t.must&&isToday(t)).length;
  return {must:must,md:md,doneO:doneO,totO:doneO+pendO};
}

/* ========= مؤقت المهام ========= */
function startTimer(taskId,by){
  const now=Date.now(); if(S.timer) stopTimer(now);
  S.timer={taskId:taskId||'',startedAt:now,by:by||'task'}; save();
}
function stopTimer(end){
  const T=S.timer; if(!T) return;
  const e=end||Date.now(), dur=Math.max(0,e-T.startedAt);
  S.timer=null;
  if(dur>=1000){
    const t=taskById(T.taskId);
    S.sessions.push({i:uid(),id:T.taskId,pid:(t&&t.projectId)||'',s:T.startedAt,e:T.startedAt+dur});
    if(t) t.spent=(t.spent||0)+dur/1000;
    if(S.sessions.length>20000) S.sessions=S.sessions.slice(-18000);
  }
  save();
}
function toggleTaskTimer(id){
  const T=S.timer;
  if(T&&T.taskId===id){ if(T.by==='pomo') pomoPause(); else stopTimer(); }
  else{
    if(S.pomo.running&&S.pomo.mode==='work'){ S.pomo.taskId=id; startTimer(id,'pomo'); }
    else startTimer(id,'task');
    const t=taskById(id); if(t&&t.status==='todo') t.status='doing';
  }
  save(); render();
}
function focusByDay(){
  const m={};
  for(const s of S.sessions){const k=dkey(new Date(s.s));m[k]=(m[k]||0)+(s.e-s.s)/60000;}
  if(S.timer){const k=dkey(new Date(S.timer.startedAt));m[k]=(m[k]||0)+(Date.now()-S.timer.startedAt)/60000;}
  return m;
}

/* ========= البومودورو ========= */
const phaseMs=mode=>{const p=S.settings.pomo;return (mode==='work'?p.work:mode==='short'?p.short:p.long)*60000;};
const pomoRemain=now=>S.pomo.running?Math.max(0,S.pomo.endAt-now):S.pomo.remaining;
const pomoToday=()=>S.pomo.day===todayKey()?S.pomo.count:0;
function syncPomoIdle(){
  const P=S.pomo;
  if(!P.running&&P.mode!=='break'&&P.remaining===P.total){P.total=phaseMs(P.mode);P.remaining=P.total;}
  save();
}
function inPrayerWindow(){
  const now=Date.now(), last=[...prayerInstants()].reverse().find(p=>p.t.getTime()<=now);
  if(last&&now<last.t.getTime()+S.settings.prayerMin*60000) return {name:last.name,ms:last.t.getTime()+S.settings.prayerMin*60000-now};
  return null;
}
function prayerBreak(){
  const w=inPrayerWindow(); if(w) return w;
  const np=nextPrayer(new Date()); if(!np) return null;
  return {name:np.name,ms:np.t.getTime()-Date.now()+S.settings.prayerMin*60000};
}
function fitWorkMs(){
  const full=S.settings.pomo.work*60000, np=nextPrayer(new Date());
  if(!np) return {ms:full};
  const mins=(np.t.getTime()-Date.now())/60000, usable=mins-5;
  if(!S.settings.pomo.fit||usable>=S.settings.pomo.work) return {ms:full,np:np,mins:mins};
  if(usable>=10) return {ms:Math.floor(usable)*60000,np:np,mins:mins,cut:true};
  return {ms:full,np:np,mins:mins,tight:true};
}
function pomoSetMode(mode,ms){
  if(S.pomo.running) pomoPause();
  S.pomo.mode=mode; S.pomo.total=ms||phaseMs(mode); S.pomo.remaining=S.pomo.total; save(); render();
}
function pomoStart(){
  const P=S.pomo; if(P.running) return;
  if(P.mode==='work'&&P.remaining===P.total){
    const f=fitWorkMs();
    if(f.cut){P.total=f.ms;P.remaining=f.ms;toast('ضُبطت الجلسة على '+Math.round(f.ms/60000)+' دقيقة لتنتهي قبل أذان '+f.np.name);}
  }
  P.endAt=Date.now()+P.remaining; P.running=true;
  if(P.mode==='work') startTimer(P.taskId,'pomo');
  const t=taskById(P.taskId); if(t&&P.mode==='work'&&t.status==='todo') t.status='doing';
  setTimeout(tick,P.remaining+60);
  save(); render();
}
function pomoPause(){
  const P=S.pomo; if(!P.running) return;
  P.remaining=Math.max(0,P.endAt-Date.now()); P.running=false;
  if(S.timer&&S.timer.by==='pomo') stopTimer();
  save(); render();
}
function pomoReset(){pomoPause();S.pomo.total=phaseMs(S.pomo.mode);S.pomo.remaining=S.pomo.total;save();render();}
function pomoSkip(){
  pomoPause();
  S.pomo.mode=S.pomo.mode==='work'?'short':'work';
  S.pomo.total=phaseMs(S.pomo.mode);S.pomo.remaining=S.pomo.total;save();render();
}
function pomoFinish(){
  const P=S.pomo, wasWork=P.mode==='work', endAt=P.endAt;
  P.running=false;
  if(S.timer&&S.timer.by==='pomo') stopTimer(endAt);
  if(wasWork){
    P.cycle++; if(P.day!==todayKey()){P.day=todayKey();P.count=0;}
    P.count++;
    const t=taskById(P.taskId); if(t) t.pomos=(t.pomos||0)+1;
    const long=P.cycle%S.settings.pomo.every===0;
    P.mode=long?'long':'short';
    notify('انتهت جلسة التركيز',long?'خذ استراحة طويلة، أنجزت '+S.settings.pomo.every+' جلسات':'خذ استراحة قصيرة','pomo');
  }else{
    P.mode='work'; notify('انتهت الاستراحة','جاهز لجلسة تركيز جديدة؟','pomo');
  }
  P.total=phaseMs(P.mode); P.remaining=P.total; save(); render();
}

/* ========= التنبيهات والصوت ========= */
let AC=null;
function audioCtx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
document.addEventListener('pointerdown',()=>{audioCtx();},{passive:true});
function beep(n){
  if(!S.settings.sound) return;
  try{
    const a=audioCtx(); if(!a) return; const t=a.currentTime;
    for(let i=0;i<(n||2);i++){
      const o=a.createOscillator(), g=a.createGain();
      o.type='sine'; o.frequency.value=i%2?660:880;
      g.gain.setValueAtTime(0.0001,t+i*0.28);
      g.gain.exponentialRampToValueAtTime(0.25,t+i*0.28+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.28+0.24);
      o.connect(g); g.connect(a.destination); o.start(t+i*0.28); o.stop(t+i*0.28+0.26);
    }
  }catch(e){}
}

/* تذكير المهام: بوقت التذكير إن حُدد، وإلا عند بداية فترة المهمة المستحقة اليوم (أو بعد الفجر إن لم تكن لها فترة).
   ما فات وقته بأكثر من 15 دقيقة (والتطبيق مغلق) لا يُنبَّه عليه. */
function checkTaskReminders(now){
  const d=new Date(now), tk=dkey(d), F=S.remFired; let ch=false;
  for(const k of Object.keys(F)) if(F[k]!==tk){delete F[k];ch=true;}
  const due=(S.settings.taskRemind?S.tasks:[]).filter(t=>!t.daily&&!t.ex&&(t.status==='todo'||t.status==='doing'));
  const fire=(key,at)=>{if(F[key]||now<at)return false;F[key]=tk;ch=true;return now-at<15*60000;};
  for(const t of due){
    if(!t.remind||(t.due&&t.due!==tk)) continue;
    const [h,m]=t.remind.split(':').map(Number), at=new Date(d); at.setHours(h||0,m||0,0,0);
    const pr=PERIODS.find(p=>p.k===t.period);
    if(fire('t'+t.id,at.getTime())) notify('تذكير: '+t.title,pr?'في فترة '+pr.name:'','remind-'+t.id);
  }
  const ps=periodsOn(startOfDay(d));
  if(ps){
    const groups={};
    for(const t of due){if(t.remind||t.must||t.due!==tk) continue;const k=t.period||'fajr';(groups[k]=groups[k]||[]).push(t);}
    for(const k of Object.keys(groups)){
      const p=ps.find(x=>x.k===k), g=groups[k]; if(!p) continue;
      if(fire('p'+k,p.start.getTime())) notify(g.length===1?'مهمة مستحقة اليوم: '+g[0].title:'لديك '+g.length+' مهام مستحقة اليوم',(g.length>1?g.slice(0,3).map(t=>t.title).join('، ')+(g.length>3?'…':'')+' · ':'')+'فترة '+p.name,'remind-'+k);
    }
  }
  if(ch) persist();
}

function updateLive(now){
  const np=nextPrayer(new Date(now));
  $$('[data-live]').forEach(el=>{
    const k=el.dataset.live;
    if(k==='next') el.textContent=np?fmtDur(Math.ceil((np.t-now)/1000)):'--:--';
    else if(k==='task'){const t=taskById(el.dataset.id);if(t)el.textContent=fmtDur(taskSpent(t));}
    else if(k==='timer-top') el.textContent=S.timer?fmtDur((now-S.timer.startedAt)/1000):'';

function streak(){
  const full=k=>{const l=S.log[k];return !!l&&PR5.every(p=>l[p]);};
  let n=0,d=startOfDay(new Date()); if(!full(dkey(d))) d=addDays(d,-1);

}
function weekChart(){
  const by=focusByDay(), days=[];
  for(let i=6;i>=0;i--){const d=addDays(startOfDay(new Date()),-i);days.push({d:d,m:by[dkey(d)]||0});}
  const max=Math.max(60,...days.map(x=>x.m)), W=320,H=150,top=20,bot=24,step=W/7,bw=26;
  let svg='<line class="axis" x1="0" x2="'+W+'" y1="'+(H-bot)+'" y2="'+(H-bot)+'"/>';
  days.forEach((x,i)=>{
    const cx=W-(i+0.5)*step, h=Math.round((H-top-bot)*x.m/max), y=H-bot-h;
    svg+='<rect class="bar'+(i===6?' today':'')+'" x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+(x.m>0?Math.max(h,2):0)+'" rx="4"/>';

  return {svg:'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="دقائق التركيز خلال آخر سبعة أيام">'+svg+'</svg>',total:total};

/* ---- التقارير والفجوات ---- */
const GS=new Intl.DateTimeFormat('ar-u-nu-latn',{weekday:'short',day:'numeric',month:'short'});
const AF=new Intl.DateTimeFormat('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function repFrom(){return UI.range==='all'?0:startOfDay(addDays(new Date(),-(UI.range-1))).getTime();}
function reportData(){
  const from=repFrom(), now=Date.now(), tk=todayKey();
  const tmap=new Map(S.tasks.map(t=>[t.id,t])), g={}, byProj={}, byDay={};
  const blank=(title,pid)=>({title:title,pid:pid||'',daily:false,days:0,done:0,missed:0,min:0,sess:0,tot:0,est:0,pomos:0,status:'',doneAt:0});
  const rowFor=t=>{const k=t.tplId||t.id;if(!g[k]){g[k]=blank(t.title,t.projectId);g[k].daily=!!t.tplId;}return g[k];};
  for(const t of S.tasks){
    if(t.daily||t.ex) continue;
    const r=rowFor(t); r.title=t.title; r.pid=t.projectId||''; r.tot+=t.spent||0; r.pomos+=t.pomos||0;
    if(t.must){
      if(t.due&&parseKey(t.due).getTime()>=from&&(t.due<tk||t.status==='done')){r.days++;if(t.status==='done')r.done++;if(t.status==='missed')r.missed++;}
    }else{r.est=t.est||0;r.status=t.status;}
    if(t.doneAt&&t.doneAt>r.doneAt) r.doneAt=t.doneAt;
  }
  let focus=0;
  const addSess=(taskId,pid,s,e)=>{
    const mins=(e-s)/60000, t=tmap.get(taskId); let r=null;
    if(t){if(!t.ex) r=rowFor(t);}
    else{const k='x'+taskId;r=g[k]||(g[k]=blank(taskId?'مهمة محذوفة':'تركيز عام (بدون مهمة)',pid));}
    focus+=mins; const pp=t?(t.projectId||''):(pid||''); byProj[pp]=(byProj[pp]||0)+mins;
    const dk=dkey(new Date(s)); byDay[dk]=(byDay[dk]||0)+mins;
    if(r){r.min+=mins;r.sess++;}
  };
  for(const s of S.sessions) if(s.s>=from) addSess(s.id,s.pid,s.s,s.e);
  if(S.timer&&S.timer.startedAt>=from) addSess(S.timer.taskId,'',S.timer.startedAt,now);
  const rows=Object.values(g).filter(r=>r.min>0||r.days>0||(r.doneAt>0&&r.doneAt>=from)).sort((a,b)=>b.min-a.min);
  const mustAll=S.tasks.filter(t=>t.must&&t.due&&parseKey(t.due).getTime()>=from&&(t.due<tk||t.status==='done'));
  const mustDone=mustAll.filter(t=>t.status==='done').length;
  const doneCount=S.tasks.filter(t=>!t.daily&&!t.ex&&t.doneAt&&t.doneAt>=from).length;
  let first=now;
  S.sessions.forEach(s=>{if(s.s<first)first=s.s;});
  S.tasks.forEach(t=>{if(!t.ex&&t.created<first)first=t.created;});
  Object.keys(S.log).forEach(k=>{const x=parseKey(k).getTime();if(x<first)first=x;});
  const days=[]; for(let d=startOfDay(Math.max(from,first));dkey(d)<tk&&days.length<366;d=addDays(d,1)) days.push(dkey(d));
  return {from:from,rows:rows,byProj:byProj,byDay:byDay,focus:focus,mustAll:mustAll,mustDone:mustDone,doneCount:doneCount,days:days,tmap:tmap};
}
function gapsList(R){
  const out=[], tk=todayKey(), nowMs=Date.now();
  const zero=R.days.filter(k=>!(R.byDay[k]>=1));
  if(R.days.length&&zero.length) out.push({c:'bad',t:'أيام بلا أي تركيز: '+zero.length+' من '+R.days.length,items:zero.slice(-10).map(k=>GS.format(parseKey(k)))});
  const ms={};
  R.mustAll.filter(t=>t.status==='missed').forEach(t=>{const k=t.tplId||t.id;ms[k]=(ms[k]||{title:t.title,n:0});ms[k].n++;});
  const msl=Object.values(ms).sort((a,b)=>b.n-a.n);
  if(msl.length) out.push({c:'bad',t:'مهام يومية إلزامية فاتتك',items:msl.map(x=>x.title+': '+x.n+' '+(x.n===1?'يوم':x.n<=10?'أيام':'يومًا'))});
  const over=S.tasks.filter(t=>!t.daily&&!t.ex&&!t.must&&(t.status==='todo'||t.status==='doing')&&t.due&&t.due<tk);
  if(over.length) out.push({c:'bad',t:'مهام تجاوزت موعدها: '+over.length,items:over.slice(0,8).map(t=>t.title+' ('+t.due+')')});
  const stale=S.tasks.filter(t=>!t.daily&&!t.ex&&!t.must&&t.status==='todo'&&!(t.spent>0)&&nowMs-t.created>7*86400000&&!(t.due&&t.due>=tk));
  if(stale.length) out.push({c:'warn',t:'مهام لم تبدأ بها منذ أكثر من أسبوع: '+stale.length,items:stale.slice(0,8).map(t=>t.title)});
  const est=R.rows.filter(r=>!r.daily&&r.est>0&&r.status==='done'&&r.tot>0).map(r=>({r:r,x:r.tot/60/r.est})).filter(o=>o.x>1.5||o.x<0.5).sort((a,b)=>Math.abs(Math.log(b.x))-Math.abs(Math.log(a.x)));
  if(est.length) out.push({c:'warn',t:'مهام بعيدة عن تقديرك للوقت',items:est.slice(0,6).map(o=>o.r.title+': استغرقت '+Math.round(o.x*100)+'% من المتوقع')});
  const stalled=S.projects.filter(p=>!p.archived&&S.tasks.some(t=>t.projectId===p.id&&(t.status==='todo'||t.status==='doing'))&&projMinutes(p.id,nowMs-7*86400000)<1);
  if(stalled.length) out.push({c:'warn',t:'مشاريع لم تعمل عليها آخر 7 أيام',items:stalled.map(p=>p.name)});
  if(Object.keys(S.log).length&&R.days.length){
    const miss={}; let part=0;
    R.days.forEach(k=>{const l=S.log[k]||{};const n=PR5.filter(p=>l[p]).length;if(n<5)part++;PR5.forEach(p=>{if(!l[p])miss[p]=(miss[p]||0)+1;});});
    if(part){const top=PR5.slice().sort((a,b)=>(miss[b]||0)-(miss[a]||0))[0];out.push({c:'warn',t:'أيام لم تسجّل فيها الصلوات الخمس كاملة: '+part+' من '+R.days.length,items:['الأكثر نقصًا في السجل: '+PRN[top]+' ('+(miss[top]||0)+' يوم)']});}
  }
  return out;
}

  return '<div class="pagehead"><div><h2>التقارير</h2><p class="muted">ماذا أنجزت، وأين ذهب وقتك، وأين الفجوات</p></div><button class="btn" data-act="rep-csv">تصدير CSV</button></div>'

    +'<div class="stats"><div class="stat"><b class="num">'+fmtMin(R.focus)+'</b><span>وقت التركيز</span></div>'

const habitById=id=>S.habits.find(h=>h.id===id);
function habitStreak(h){
  let d=startOfDay(new Date()), n=0; if(!h.done[dkey(d)]) d=addDays(d,-1);
  while(h.done[dkey(d)]&&n<5000){n++;d=addDays(d,-1);}
  return n;
}
function bestRun(keys){
  let best=0,run=0,prev='';
  for(const k of keys.slice().sort()){run=(prev&&dkey(addDays(parseKey(prev),1))===k)?run+1:1;if(run>best)best=run;prev=k;}
  return best;
}

/* تُفحص الأهداف والشارات مع كل عرض. أول فحص على جهاز جديد يفتح المستحق بصمت حتى لا تنهال التنبيهات */
function checkBadges(){
  const B=S.settings.badges, quiet=!S.badgeInit; let ch=false;
  for(const g of S.goals){
    const hit=goalVal(g)>=g.target;
    if(hit&&!g.doneAt){g.doneAt=Date.now();ch=true;if(!quiet)toast('🎉 حققت هدفك: '+g.name);}
    else if(!hit&&g.doneAt){g.doneAt=0;ch=true;}
  }
  for(const b of BADGES){
    if(B[b.id]||b.v()<b.g) continue;
    B[b.id]=Date.now(); ch=true;
    if(!quiet){toast('🏅 إنجاز جديد: '+b.n+' — '+b.d);beep(3);}
  }
  if(quiet){S.badgeInit=true;ch=true;}
  if(ch) save();
}
function viewBadges(){
  const B=S.settings.badges, got=BADGES.filter(b=>B[b.id]).length;
  return '<div class="pagehead"><div><h2>الإنجازات</h2><p class="muted">فتحت <span class="num">'+got+'</span> من <span class="num">'+BADGES.length+'</span> شارة</p></div></div>'
    +'<div class="bgrid">'+BADGES.map(b=>{
      const on=!!B[b.id], v=Math.min(b.g,Math.floor(b.v()));
      return '<div class="badge'+(on?' got':' lock')+'"><span class="bi" aria-hidden="true">'+b.i+'</span><h4>'+esc(b.n)+'</h4><p>'+esc(b.d)+'</p>'
        +(on?'<span class="chip">فُتحت '+esc(GS.format(new Date(B[b.id])))+'</span>':'<div class="meter" style="--pc:var(--accent);width:100%"><i style="width:'+(v/b.g*100).toFixed(0)+'%"></i></div><span class="pc-r"><span class="num">'+v+'/'+b.g+'</span></span>')+'</div>';
    }).join('')+'</div>';
}

function fillSelect(id,pairs){$(id).innerHTML=pairs.map(p=>'<option value="'+p[0]+'">'+p[1]+'</option>').join('');}
function fillCats(){$('#tCat').innerHTML=catKeys().map(k=>'<option value="'+esc(k)+'">'+esc(catName(k))+'</option>').join('');}
function subRow(s){return '<div class="subrow"><input type="checkbox" class="sd"'+(s.d?' checked':'')+' aria-label="منجزة"><input type="text" class="st" value="'+esc(s.t)+'" maxlength="100" aria-label="مهمة فرعية"><button type="button" class="iconbtn sm" data-act="sub-del" aria-label="حذف">'+ic('x',14)+'</button></div>';}
function openTask(id,pre){
  pre=pre||{}; EDIT=id||null;
  const t=id?taskById(id):null;
  const d=t||{title:'',notes:'',cat:'personal',prio:'normal',period:pre.period||'',due:pre.due||'',est:'',repeat:'none',status:pre.status||'todo',subs:[],projectId:pre.projectId||'',remind:''};
  fillCats();
  $('#tProject').innerHTML='<option value="">بدون مشروع</option>'+S.projects.filter(p=>!p.archived||p.id===d.projectId).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');
  $('#tProject').value=d.projectId||'';
  const canDaily=!t||(!t.tplId&&!t.daily&&!t.must&&t.status!=='done');
  $('#tDailyRow').hidden=!canDaily; $('#tDaily').checked=!!pre.daily;
  $('#dlgTitle').textContent=t?'تعديل المهمة':'مهمة جديدة';
  $('#tTitle').value=d.title; $('#tNotes').value=d.notes||'';
  $('#tCat').value=catKeys().includes(d.cat)?d.cat:'personal'; $('#tPrio').value=d.prio; $('#tRemind').value=d.remind||''; $('#tPeriod').value=d.period||'';
  $('#tStatus').value=d.status; $('#tDue').value=d.due||''; $('#tEst').value=d.est||''; $('#tRepeat').value=d.repeat||'none';
  $('#subList').innerHTML=(d.subs||[]).map(subRow).join('');
  const del=$('#btnDel'); del.hidden=!t; del.dataset.lbl=(t&&t.tplId)?'إيقاف المهمة اليومية':'حذف المهمة'; del.textContent=del.dataset.lbl; delete del.dataset.armed;
  $('#dlg').showModal(); $('#tTitle').focus();
}
function saveTask(){
  const title=$('#tTitle').value.trim(); if(!title){$('#tTitle').focus();return;}
  const subs=$$('#subList .subrow').map(r=>({t:$('.st',r).value.trim(),d:$('.sd',r).checked})).filter(x=>x.t);
  const data={title:title,notes:$('#tNotes').value.trim(),cat:$('#tCat').value,prio:$('#tPrio').value,period:$('#tPeriod').value,due:$('#tDue').value,est:Number($('#tEst').value)||0,repeat:$('#tRepeat').value,subs:subs,projectId:$('#tProject').value,remind:$('#tRemind').value};
  const wantDaily=$('#tDaily').checked&&!$('#tDailyRow').hidden;
  let status=$('#tStatus').value, t;
  if(wantDaily){Object.assign(data,{daily:true,due:'',repeat:'none',since:todayKey()});status='todo';}
  if(EDIT){
    t=taskById(EDIT);Object.assign(t,data);t.ex=false;
    if(t.tplId){
      const tpl=taskById(t.tplId);
      if(tpl){['title','notes','cat','prio','period','est','projectId','remind'].forEach(k=>{tpl[k]=data[k];});tpl.subs=subs.map(s=>({t:s.t,d:false}));}
    }
  }else{t=newTask(data);}
  if(status!==t.status) setStatus(t.id,status);
  if(wantDaily){ensureDaily();toast('أُضيفت مهمة يومية، تتجدد كل يوم');}
  else laterToast(t);
  save(); $('#dlg').close(); render();
}

const CFG=window.WAQTI_CONFIG||{};
const CLOUD={on:!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY),sb:null,user:null,state:CFG.SUPABASE_URL?'idle':'off',msg:'',busy:false,t:null,lastOk:0,changed:false,missing:new Set()};
/* ready: لا بيانات سحابية تنتظر الدمج (لا سحابة، أو لم يُسجَّل دخول على هذا الجهاز، أو تم أول سحب) */
CLOUD.ready=!CLOUD.on||!S.sync.email;
const COLS=['tasks','projects','sessions','day_logs','settings','habits','goals','journals'];
/* الجداول الجديدة اختيارية: إن لم يُشغَّل schema.sql بعد تُتجاوز ويستمر مزامنة الباقي */
const OPT_COLS=['habits','goals','journals'];
const noTable=e=>/PGRST205|42P01/.test((e&&e.code)||'')||/does not exist|could not find the table/i.test((e&&e.message)||'');
const CLOUD_LBL={off:'السحابة غير مفعّلة',offline:'تعذّر تحميل مكتبة السحابة',signedout:'سجّل الدخول للمزامنة',idle:'جاهز',sync:'جارٍ المزامنة…',ok:'متزامن',err:'خطأ في المزامنة'};
function hsh(o){const s=JSON.stringify(o,(k,v)=>k==='_u'||k==='_a'?undefined:v);let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+':'+s.length;}
function entries(c){
  if(c==='tasks') return S.tasks.filter(t=>!t.ex).map(t=>[t.id,t]);
  if(c==='projects') return S.projects.map(p=>[p.id,p]);
  if(c==='sessions') return S.sessions.map(s=>[s.i,s]);
  if(c==='day_logs') return Object.keys(S.log).map(k=>[k,S.log[k]]);
  if(c==='habits') return S.habits.map(h=>[h.id,h]);
  if(c==='goals') return S.goals.map(g=>[g.id,g]);
  if(c==='journals') return Object.keys(S.journal).map(k=>[k,S.journal[k]]);
  return [['main',S.settings]];
}
function applyRemote(c,id,d){
  const put=(arr,key)=>{const i=arr.findIndex(x=>x[key]===id);if(i<0)arr.push(d);else arr[i]=d;};
  if(c==='tasks') put(S.tasks,'id');
  else if(c==='projects') put(S.projects,'id');
  else if(c==='sessions') put(S.sessions,'i');
  else if(c==='day_logs') S.log[id]=d;
  else if(c==='habits'){if(!d.done||typeof d.done!=='object')d.done={};put(S.habits,'id');}
  else if(c==='goals') put(S.goals,'id');
  else if(c==='journals') S.journal[id]=d;
  else{const b=DEF().settings;S.settings=Object.assign({},b,d,{offsets:Object.assign({},b.offsets,d.offsets||{}),pomo:Object.assign({},b.pomo,d.pomo||{})});}
}
function removeLocal(c,id){
  if(c==='tasks') S.tasks=S.tasks.filter(t=>t.id!==id);
  else if(c==='projects') S.projects=S.projects.filter(p=>p.id!==id);
  else if(c==='sessions') S.sessions=S.sessions.filter(s=>s.i!==id);
  else if(c==='day_logs') delete S.log[id];
  else if(c==='habits') S.habits=S.habits.filter(h=>h.id!==id);
  else if(c==='goals') S.goals=S.goals.filter(g=>g.id!==id);
  else if(c==='journals') delete S.journal[id];
}
function dirtyList(c){
  const snap=S.sync.snap[c], cur={}, ch=[];
  for(const e of entries(c)){cur[e[0]]=1;const h=hsh(e[1]);if(snap[e[0]]!==h)ch.push([e[0],e[1],h]);}
  const dels=c==='settings'?[]:Object.keys(snap).filter(id=>!cur[id]);
  return {ch:ch,dels:dels};
}
function mergeRemote(c,r){
  const d=r.data||{}, local=new Map(entries(c)).get(r.id);
  const lu=local?(local._u||0):-1, ru=d._u||0, snap=S.sync.snap[c];
  if(r.deleted){
    if(local&&ru>=lu){removeLocal(c,r.id);CLOUD.changed=true;}
    if(!local||ru>=lu) delete snap[r.id];
    return;
  }
  if(!local&&snap[r.id]!==undefined) return; // حُذف محليًا ولم يُرفع الحذف بعد
  if(!local||ru>lu){applyRemote(c,r.id,d);snap[r.id]=hsh(d);CLOUD.changed=true;}
  else if(snap[r.id]===undefined&&ru===lu) snap[r.id]=hsh(local);
}
async function pullAll(){
  for(const c of COLS){
    let since=S.sync.last[c]||'1970-01-01T00:00:00Z';
    for(;;){
      const q=await CLOUD.sb.from(c).select('id,data,deleted,updated_at').gte('updated_at',since).order('updated_at',{ascending:true}).limit(1000);
      if(q.error&&OPT_COLS.includes(c)&&noTable(q.error)){CLOUD.missing.add(c);break;}
      if(q.error) throw q.error;
      const rows=q.data||[];
      for(const r of rows){mergeRemote(c,r);since=r.updated_at;}
      if(rows.length<1000) break;
    }
    S.sync.last[c]=since;
  }
}
async function pushAll(){
  const uidc=CLOUD.user.id;
  for(const c of COLS){
    if(CLOUD.missing.has(c)) continue;
    const dl=dirtyList(c), rows=[];
    for(const e of dl.ch) rows.push({user_id:uidc,id:String(e[0]),data:e[1],deleted:false});
    if(c!=='sessions') for(const id of dl.dels) rows.push({user_id:uidc,id:String(id),data:{_u:Date.now()},deleted:true});
    for(let i=0;i<rows.length;i+=400){
      const q=await CLOUD.sb.from(c).upsert(rows.slice(i,i+400),{onConflict:'user_id,id'});
      if(q.error) throw q.error;
    }
    for(const e of dl.ch) S.sync.snap[c][e[0]]=e[2];
    for(const id of dl.dels) delete S.sync.snap[c][id];
  }
}
/* كل سجل تغيّر يأخذ وقت الآن، إلا ما غيّرته ensureDaily تلقائيًا ولم يُمس بعدها (بصمته = _a) فيبقى وقته القديم ليغلبه أي تعديل حقيقي */
function bumpDirty(){
  const now=Date.now();
  for(const c of COLS) for(const e of dirtyList(c).ch){
    const o=e[1], auto=o._a===e[2];
    delete o._a; if(!auto) o._u=now;
  }
}
function setCloud(state,msg){
  CLOUD.state=state;CLOUD.msg=msg||'';
  renderTop();const el=$('#cloudStat');if(el)el.textContent=CLOUD_LBL[state]+(msg?': '+msg:'');

async function syncNow(manual){
  if(!CLOUD.on||!CLOUD.sb||!CLOUD.user||CLOUD.busy) return;
  const prevMissing=CLOUD.missing.size;
  CLOUD.busy=true;CLOUD.changed=false;CLOUD.missing.clear();setCloud('sync');
  try{
    bumpDirty();await pullAll();await pushAll();persist();
    CLOUD.lastOk=Date.now();setCloud('ok');
    if(manual) toast(CLOUD.missing.size?'تمت المزامنة، عدا العادات والأهداف والمذكرة (شغّل schema.sql)':'تمت المزامنة');
    if(UI.view==='settings'&&(manual||CLOUD.missing.size!==prevMissing)) render();
    const typing=document.activeElement&&document.activeElement.id==='jText', firstPull=!CLOUD.ready;
    CLOUD.ready=true;
    if(CLOUD.changed||firstPull){ensureDaily();persist();if(!$('#dlg').open&&UI.view!=='settings'&&!typing)render();}
  }catch(e){
    setCloud('err',(e&&e.message)||'');
    if(manual) toast('تعذّرت المزامنة: '+((e&&e.message)||'تحقق من الاتصال'));
  }finally{CLOUD.busy=false;}
}
function scheduleSync(){

}

async function cloudReset(){
  if(!CLOUD.sb){toast('مكتبة السحابة لم تُحمَّل بعد. تحقق من الاتصال');return;}
  const em=$('#cEmail').value.trim();
  if(!em){toast('أدخل بريدك الإلكتروني أولًا');return;}
  const r=await CLOUD.sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  if(r.error){toast('تعذّر الأمر: '+r.error.message);return;}
  toast('إن كان البريد مسجّلًا فقد أرسلنا إليه رابط استعادة كلمة المرور');
}
async function cloudNewPass(){
  if(!CLOUD.sb||!CLOUD.user) return;
  const pw=$('#cNewPass').value;
  if(pw.length<6){toast('كلمة المرور 6 خانات على الأقل');return;}
  const r=await CLOUD.sb.auth.updateUser({password:pw});
  if(r.error){toast('تعذّر الأمر: '+r.error.message);return;}
  CLOUD.recovery=false;$('#cNewPass').value='';
  toast('تم تغيير كلمة المرور');
  if(UI.view==='settings') render();
}
async function cloudAuth(mode){
  if(!CLOUD.sb){toast('مكتبة السحابة لم تُحمَّل بعد. تحقق من الاتصال');return;}
  const em=$('#cEmail').value.trim(), pw=$('#cPass').value;
  if(!em||pw.length<6){toast('أدخل البريد الإلكتروني وكلمة مرور من 6 خانات على الأقل');return;}
  const r=mode==='up'?await CLOUD.sb.auth.signUp({email:em,password:pw}):await CLOUD.sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){toast(/invalid login/i.test(r.error.message)?'البريد أو كلمة المرور غير صحيحة. إن نسيتها فاضغط «إرسال رابط الاستعادة»':'تعذّر الأمر: '+r.error.message);return;}
  if(mode==='up'&&!r.data.session) toast('تم إنشاء الحساب. أكّد بريدك الإلكتروني ثم سجّل الدخول');
}
async function cloudSignOut(){if(CLOUD.sb) await CLOUD.sb.auth.signOut();}

/* ========= التشغيل ========= */
function applyTheme(){
  const t=S.settings.theme, r=document.documentElement;
  if(t==='light'||t==='dark') r.setAttribute('data-theme',t); else r.removeAttribute('data-theme');
}
function reloadTimes(manual){
  DAYS={}; renderTop();
  return ensureTimes().then(()=>{
    primeFired();
    if(!TS.err){if(manual)toast('تم تحديث المواقيت');}
    else toast('تعذّر جلب المواقيت. تحقق من الاتصال بالإنترنت');
    renderTop(); if(UI.view!=='settings') render();
  });
}
let lastMin=-1, CUR_DAY=todayKey();
function tick(){
  const now=Date.now();
  checkEvents(now);
  if(S.pomo.running&&now>=S.pomo.endAt) pomoFinish();
  const d=new Date(now);
  if(d.getMinutes()!==lastMin){
    lastMin=d.getMinutes();
    checkTaskReminders(now);
    if(dkey(d)!==CUR_DAY){CUR_DAY=dkey(d);ensureDaily();ensureTimes().then(()=>{renderTop();render();});}
    renderTop();
    if(UI.view==='dashboard'&&!document.hidden) render();
  }
  updateLive(now);
}
(function init(){
  fillCats();
  fillSelect('#tPrio',Object.keys(PRIOS).map(k=>[k,PRIOS[k]]));
  fillSelect('#tPeriod',[['','الوارد (بدون فترة)']].concat(PERIODS.map(p=>[p.k,p.name])));
  fillSelect('#tStatus',Object.keys(STAT).map(k=>[k,STAT[k]]));
  fillSelect('#tRepeat',Object.keys(REPEATS).map(k=>[k,REPEATS[k]]));
  fillSelect('#pColor',[[1,'أزرق'],[2,'بنفسجي'],[3,'أخضر مزرق'],[4,'برتقالي'],[5,'أخضر'],[6,'رمادي']]);
  if(!S.seeded) seed();
  ensureDaily();
  applyTheme(); render();
  ensureTimes().then(()=>{primeFired();renderTop();render();});
  cloudInit();
  setInterval(tick,1000);
  setInterval(()=>{if(CLOUD.user&&!document.hidden) syncNow();},90000);
  window.addEventListener('online',()=>syncNow());
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;}).catch(()=>{});
  }
})();
</script>
